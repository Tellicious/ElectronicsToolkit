version: 2
updates:
  # Keep the actions in our workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
        interval: "weekly"
        day: "sunday"
        time: "02:00"
        timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Bundle all action bumps into a single PR per week to avoid noise.
      actions:
        patterns:
          - "*"
    assignees:
      - "Tellicious"

