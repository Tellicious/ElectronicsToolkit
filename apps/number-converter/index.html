<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="../../manifest.json">
  <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
  <link rel="stylesheet" href="../../assets/styles.css">
  <link rel="stylesheet" href="number-converter.css">
  <title>Number Converter — Electronics Toolkit</title>
  <script src="../../assets/app.js"></script>
</head>

<body class="number-converter-app">
  <header class="appbar" id="appbar">
    <a class="appbar__back" href="../../index.html" aria-label="Back">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none">
        <path d="M9.5 1.5L1.5 9l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
      <span>Electronics Toolkit</span>
    </a>
    <span class="appbar__spacer"></span>
    <button class="appbar__action" id="clearBtn" type="button">Clear</button>
  </header>

  <main class="number-converter-shell" aria-label="Decimal, hexadecimal and binary converter">
    <section class="number-converter-panel number-converter-panel--input" aria-labelledby="decimalLabel">
      <div class="number-converter-panel__head">
        <label id="decimalLabel" class="number-converter-panel__label" for="decimalInput">Decimal</label>
      </div>
      <textarea id="decimalInput" class="number-converter-value-input" inputmode="numeric" autocomplete="off" autocorrect="off"
        autocapitalize="none" spellcheck="false" rows="1" wrap="off" aria-describedby="statusText"></textarea>
    </section>

    <section class="number-converter-panel number-converter-panel--input" aria-labelledby="hexLabel">
      <div class="number-converter-panel__head">
        <label id="hexLabel" class="number-converter-panel__label" for="hexInput">Hex</label>
        <span class="number-converter-panel__hint">0x optional</span>
      </div>
      <textarea id="hexInput" class="number-converter-value-input number-converter-value-input--mono" inputmode="text" autocomplete="off"
        autocorrect="off" autocapitalize="characters" spellcheck="false" rows="1" wrap="off"
        aria-describedby="statusText"></textarea>
    </section>

    <section class="number-converter-panel number-converter-panel--binary" aria-labelledby="binaryLabel">
      <div class="number-converter-panel__head">
        <h2 id="binaryLabel" class="number-converter-panel__label">Binary</h2>
        <span class="number-converter-panel__hint">tap a bit to flip it</span>
      </div>
      <div class="number-converter-binary-grid" id="binaryGrid" role="group" aria-label="64 binary bits"></div>
    </section>

    <p id="statusText" class="number-converter-status" aria-live="polite"></p>
  </main>

  <script src="number-converter.js"></script>
  <!-- Service worker registration lives in assets/app.js (shared by every page). -->
</body>

</html>
