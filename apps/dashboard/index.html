<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f7">
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../assets/styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="../../assets/app.js"></script>
    <title>Dashboard — Electronics Toolkit</title>
</head>

<body>
    <header class="appbar"><a class="appbar__back" href="../../index.html"><svg width="11" height="18"
                viewBox="0 0 11 18" fill="none">
                <path d="M9.5 1.5L1.5 9l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg><span>Electronics Toolkit</span></a><span class="appbar__spacer"></span></header>
    <main class="tool-shell dashboard-shell">

        <section class="tool-card dashboard-card">
            <h2 class="tool-card__title">Speed & G-Force</h2>
            <div class="dashboard-gauge" id="speedGauge"></div>

            <div class="dashboard-gmeter">
                <div class="dashboard-gmeter__dir dashboard-gmeter__dir--top">
                    <span class="dashboard-gmeter__k">Brake</span><span id="gBrake"
                        class="dashboard-gmeter__v">0.00</span>
                </div>
                <div class="dashboard-gmeter__dir dashboard-gmeter__dir--left">
                    <span class="dashboard-gmeter__k">Left</span><span id="gLeft"
                        class="dashboard-gmeter__v">0.00</span>
                </div>
                <div class="dashboard-gmeter__pad" id="gPad"></div>
                <div class="dashboard-gmeter__dir dashboard-gmeter__dir--right">
                    <span class="dashboard-gmeter__k">Right</span><span id="gRight"
                        class="dashboard-gmeter__v">0.00</span>
                </div>
                <div class="dashboard-gmeter__dir dashboard-gmeter__dir--bottom">
                    <span class="dashboard-gmeter__k">Accel</span><span id="gAccel"
                        class="dashboard-gmeter__v">0.00</span>
                </div>
            </div>
            <div class="dashboard-gmeter__live">
                <span class="dashboard-gmeter__cur"><strong id="gCur">—</strong> g</span>
                <span class="dashboard-gmeter__peak">Peak <span id="gPeak">0.00</span> g</span>
            </div>
            <div id="status" class="status-line">Tap Start to begin</div>
            <button class="btn btn--primary btn--block" id="startBtn" type="button">Start</button>
            <button class="btn btn--block" id="resetMax" type="button">Reset max</button>
        </section>
    </main>

    <script src="../../assets/sensorkit/format.js"></script>
    <script src="../../assets/sensorkit/gauge.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
